name: Deploy ReactJS App to Local VM Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1. GitHub Runner tự clone code mới nhất từ GitHub về
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Build & Run Docker trực tiếp từ thư mục code vừa clone
      - name: Build and Run Docker Container
        run: |
          # Build Docker Image trực tiếp từ workspace
          docker build -t react-app:latest .

          # Stop và xóa Container cũ (nếu có)
          docker stop react-app-container || true
          docker rm react-app-container || true

          # Chạy Container mới trên port 3838
          docker run -d --name react-app-container --restart always -p 3838:80 react-app:latest

          # Dọn dẹp image rác
          docker image prune -f